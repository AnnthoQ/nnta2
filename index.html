<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Parada de planta · TA2 Negociación</title>
  <script>
    // Compatibilidad con AI-EXPO: ?admin abre el panel de control
    if (/[?&]admin\b/.test(location.search)) {
      const q = new URLSearchParams(location.search); q.delete('admin');
      location.replace('control.html' + (q.toString() ? '?' + q : ''));
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="css/ios.css?v=2">
  <link rel="stylesheet" href="css/stage.css?v=2">
  <style>
    body.screen { overflow: hidden; }
    body.nocursor, body.nocursor * { cursor: none !important; }
    .hint { position: fixed; top: 22px; right: 22px; z-index: 5; font-size: 15px; padding: 10px 16px; color: var(--label);
      opacity: 0; transform: translateY(-12px); transition: opacity .4s var(--ease), transform .5s var(--spring); pointer-events: none; }
    .hint::before { border-radius: 999px; }
    .hint.show { opacity: 1; transform: none; }
    .blackout::after { content: ""; position: fixed; inset: 0; z-index: 50; background: #000; }
  </style>
</head>
<body class="screen">
  <main id="screen" class="full" aria-live="polite"></main>
  <div id="hint" class="hint capsule glass" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/icons.js?v=2"></script>
  <script src="js/deck.js?v=3"></script>
  <script src="js/stage.js?v=2"></script>
  <script src="js/sync.js?v=2"></script>
  <script src="js/proyector.js?v=2"></script>
</body>
</html>
