<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Panel · TA2 Negociación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap">
  <link rel="stylesheet" href="css/ios.css?v=2">
  <link rel="stylesheet" href="css/stage.css?v=2">
  <link rel="stylesheet" href="css/control.css?v=2">
</head>
<body class="control">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <div class="app">
    <header class="topbar">
      <span class="capsule glass" id="status"><span class="dot"></span><span>Conectando…</span></span>
      <span class="grow"></span>
      <button class="capsule glass timer" id="timer" title="Tocar para reiniciar el cronómetro">00:00</button>
    </header>

    <div class="col-a">
      <div class="preview" id="previewBox">
        <div id="preview"></div>
        <span class="badge capsule" id="pos">1 / 14</span>
      </div>
      <div class="steps" id="steps" aria-hidden="true"></div>
    </div>

    <div class="col-b">
      <div class="now">
        <span class="num" id="num">1</span>
        <div><h1 id="title">Portada</h1><small id="sub"></small></div>
      </div>
      <div class="section-label">Ahora</div>
      <div class="script" id="script" aria-live="polite"></div>
      <div class="section-label" id="nextLabel">A continuación</div>
      <div class="script next" id="next"></div>
    </div>
  </div>

  <nav class="dock glass" aria-label="Controles">
    <div class="nav">
      <button class="btn prev" id="prev"><span data-i="atras"></span>Anterior</button>
      <button class="btn next" id="nextBtn">Siguiente<span data-i="adelante"></span></button>
    </div>
    <div class="tools">
      <button class="tool" id="tSlides"><span data-i="cuadricula"></span>Láminas</button>
      <button class="tool" id="tAll"><span data-i="expandir"></span>Mostrar todo</button>
      <button class="tool" id="tQA"><span data-i="chats"></span>Preguntas</button>
      <button class="tool" id="tScreen"><span data-i="envivo"></span>Proyector</button>
    </div>
  </nav>

  <div class="sheet-back" id="sheetBack"></div>
  <section class="sheet" id="sheetSlides" aria-label="Láminas">
    <div class="grabber"></div>
    <h2>Láminas <button class="icon-btn" data-close><span data-i="cerrar"></span></button></h2>
    <div class="list" id="slideList"></div>
  </section>
  <section class="sheet" id="sheetQA" aria-label="Preguntas probables">
    <div class="grabber"></div>
    <h2>Preguntas probables <button class="icon-btn" data-close><span data-i="cerrar"></span></button></h2>
    <div class="list qa" id="qaList"></div>
  </section>

  <div class="gate" id="gate" hidden>
    <form class="card glass" id="gateForm" autocomplete="off">
      <span class="lock" data-i="candado"></span>
      <h2>Panel de control</h2>
      <p>Escribe la clave del grupo para mover la presentación desde este dispositivo.</p>
      <input id="pin" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Clave" aria-label="Clave">
      <div class="err" id="pinErr"></div>
      <button class="btn next" type="submit">Entrar</button>
      <a class="alt" href="control.html?local">Probar en este navegador (modo local)</a>
    </form>
  </div>

  <div class="toast glass" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/icons.js?v=2"></script>
  <script src="js/deck.js?v=2"></script>
  <script src="js/stage.js?v=2"></script>
  <script src="js/sync.js?v=2"></script>
  <script src="js/control.js?v=2"></script>
</body>
</html>
